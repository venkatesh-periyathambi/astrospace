<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="1180" height="655" role="img">
  <rect width="720" height="400" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#212529">
    <text x="360" y="24" text-anchor="middle" font-size="13" font-weight="700">EACH SHARD RETURNS ONLY ITS OWN TOP 3</text>

    <rect x="60" y="40" width="160" height="130" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
    <text x="140" y="62" text-anchor="middle" font-size="12" font-weight="700">shard 1</text>
    <rect x="280" y="40" width="160" height="130" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
    <text x="360" y="62" text-anchor="middle" font-size="12" font-weight="700">shard 2</text>
    <rect x="500" y="40" width="160" height="130" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
    <text x="580" y="62" text-anchor="middle" font-size="12" font-weight="700">shard 3</text>

    <g fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5">
      <circle cx="96" cy="85" r="5"/><circle cx="96" cy="105" r="5"/><circle cx="96" cy="125" r="5"/>
      <circle cx="316" cy="85" r="5"/><circle cx="316" cy="105" r="5"/><circle cx="316" cy="125" r="5"/>
      <circle cx="536" cy="85" r="5"/><circle cx="536" cy="105" r="5"/><circle cx="536" cy="125" r="5"/>
    </g>
    <g fill="#ffffff" stroke="#adb5bd" stroke-width="1.5">
      <circle cx="96" cy="148" r="5"/><circle cx="536" cy="148" r="5"/>
    </g>
    <circle cx="316" cy="148" r="6" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/>

    <g font-size="11.5" fill="#212529">
      <text x="110" y="89">global #1</text>
      <text x="110" y="109">global #4</text>
      <text x="110" y="129">global #6</text>
      <text x="330" y="89">global #2</text>
      <text x="330" y="109">global #5</text>
      <text x="330" y="129">global #7</text>
      <text x="550" y="89">global #3</text>
      <text x="550" y="109">global #9</text>
      <text x="550" y="129">global #10</text>
    </g>
    <g font-size="11.5" fill="#adb5bd">
      <text x="110" y="152">global #11</text>
      <text x="550" y="152">global #12</text>
    </g>
    <text x="330" y="152" font-size="11.5" font-weight="700" fill="#c92a2a">global #8</text>

    <text x="360" y="196" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c92a2a">Rank 8 globally, but only rank 4 inside its shard, so it never leaves.</text>
    <text x="360" y="213" text-anchor="middle" font-size="11" fill="#495057">Your "top 10" is missing a document and no score moved anywhere.</text>

    <line x1="40" y1="238" x2="680" y2="238" stroke="#dee2e6" stroke-width="1.5" stroke-dasharray="4 5"/>

    <text x="360" y="266" text-anchor="middle" font-size="13" font-weight="700">AND WHEN ONE SHARD IS SLOW</text>
    <rect x="60" y="282" width="160" height="52" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
    <text x="140" y="304" text-anchor="middle" font-size="12" font-weight="700">shard 1</text>
    <text x="140" y="321" text-anchor="middle" font-size="11" fill="#495057">3 results</text>
    <rect x="280" y="282" width="160" height="52" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
    <text x="360" y="304" text-anchor="middle" font-size="12" font-weight="700">shard 2</text>
    <text x="360" y="321" text-anchor="middle" font-size="11" fill="#495057">3 results</text>
    <rect x="500" y="282" width="160" height="52" rx="8" fill="#ffe3e3" fill-opacity="0.6" stroke="#e03131" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="580" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#c92a2a">shard 3</text>
    <text x="580" y="321" text-anchor="middle" font-size="11" fill="#c92a2a">timed out, nothing</text>

    <rect x="230" y="350" width="260" height="30" rx="6" fill="#a5d8ff" fill-opacity="0.40" stroke="#1971c2" stroke-width="2"/>
    <text x="360" y="370" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1864ab">200 OK, 6 results</text>
  </g>
</svg>

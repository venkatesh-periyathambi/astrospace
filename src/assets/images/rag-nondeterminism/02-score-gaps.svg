<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="1180" height="715" role="img">
  <rect width="720" height="436" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#212529">

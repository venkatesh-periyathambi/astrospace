      <line x1="100" y1="194" x2="250" y2="194"/>
      <line x1="100" y1="228" x2="250" y2="228"/>
      <line x1="100" y1="258" x2="250" y2="258"/>
      <line x1="100" y1="286" x2="250" y2="286"/>
      <line x1="100" y1="300" x2="250" y2="300"/>
      <line x1="100" y1="313" x2="250" y2="313"/>
    </g>
    <g stroke="#adb5bd" stroke-width="2.5">

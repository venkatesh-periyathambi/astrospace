    <text x="336" y="313" text-anchor="end" font-size="10" font-weight="700" fill="#c92a2a">cutoff</text>
    <text x="175" y="366" text-anchor="middle" font-size="10" font-weight="700" fill="#c92a2a">noise floor</text>

    <g stroke="#1971c2" stroke-width="2.5">
      <line x1="440" y1="190" x2="590" y2="190"/>

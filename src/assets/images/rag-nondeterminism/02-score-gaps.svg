    <text x="530" y="32" text-anchor="middle" font-size="13.5" font-weight="700">Near-duplicate corpus</text>
    <rect x="40" y="48" width="300" height="340" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <rect x="380" y="48" width="300" height="340" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>

    <rect x="100" y="279" width="150" height="66" fill="#ffe3e3" fill-opacity="0.8"/>
    <rect x="440" y="183" width="150" height="91" fill="#ffe3e3" fill-opacity="0.8"/>

    <line x1="72" y1="62" x2="72" y2="374" stroke="#868e96" stroke-width="1.5"/>
    <text x="60" y="220" font-size="10.5" fill="#868e96" text-anchor="middle" transform="rotate(-90 60 220)">score</text>
    <line x1="412" y1="62" x2="412" y2="374" stroke="#868e96" stroke-width="1.5"/>
    <text x="400" y="220" font-size="10.5" fill="#868e96" text-anchor="middle" transform="rotate(-90 400 220)">score</text>

    <g stroke="#1971c2" stroke-width="2.5">
      <line x1="100" y1="70" x2="250" y2="70"/>
      <line x1="100" y1="98" x2="250" y2="98"/>
      <line x1="100" y1="128" x2="250" y2="128"/>

    <text x="515" y="295" text-anchor="middle" font-size="10" font-weight="700" fill="#c92a2a">noise floor</text>

    <text x="190" y="408" text-anchor="middle" font-size="11" fill="#495057">Only ranks 8 to 12 sit inside the band,</text>
    <text x="190" y="424" text-anchor="middle" font-size="11" fill="#495057">so only they swap across the cutoff.</text>
    <text x="530" y="408" text-anchor="middle" font-size="11" fill="#495057">Every gap sits inside the band.</text>
    <text x="530" y="424" text-anchor="middle" font-size="11" fill="#495057">The order is effectively arbitrary.</text>
  </g>

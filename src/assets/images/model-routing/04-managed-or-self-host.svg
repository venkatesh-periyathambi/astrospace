<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="900" height="580" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="450" y="34.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1e1e1e">Should you host the model yourself?</text>
  <rect x="60" y="90" width="440" height="84" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="280.0" y="114.45" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e">Are the weights open?</text>
  <text x="280.0" y="132.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#495057">You cannot self-host a closed-weight model.</text>
  <text x="280.0" y="149.55" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#495057">Swapping to one is a model decision, not a hosting decision.</text>
  <path d="M 500,132 L 620,132" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="546" y="118.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12"  fill="#2f9e44">no</text>
  <path d="M 280,174 L 280,230" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
  <text x="290" y="202.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12"  fill="#495057">yes</text>
  <rect x="60" y="230" width="440" height="84" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="280.0" y="254.45" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e">Will the GPUs run hot around the clock?</text>
  <text x="280.0" y="272.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#495057">Managed inference bills per token, with no idle cost.</text>
  <text x="280.0" y="289.55" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#495057">Dedicated GPUs bill per hour whether traffic arrives or not.</text>
  <path d="M 500,272 L 620,272" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="546" y="258.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12"  fill="#2f9e44">no</text>
  <path d="M 280,314 L 280,370" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
  <text x="290" y="342.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12"  fill="#495057">yes</text>
  <rect x="60" y="370" width="440" height="84" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="280.0" y="394.45" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e">Do you have a team to run inference as a product?</text>
  <text x="280.0" y="412.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#495057">Capacity planning, autoscaling, server tuning, patching,</text>
  <text x="280.0" y="429.55" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#495057">failover. None of it is the thing your customers pay for.</text>
  <path d="M 500,412 L 620,412" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="546" y="398.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12"  fill="#2f9e44">no</text>
  <path d="M 620,132 L 620,412" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 620,272 L 700,272" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
  <rect x="700" y="202" width="160" height="140" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="780.0" y="250.4" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e">Use the</text>
  <text x="780.0" y="272.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#495057">managed</text>
  <text x="780.0" y="293.6" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#495057">service</text>
  <path d="M 280,454 L 280,496" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
  <text x="290" y="475.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12"  fill="#495057">yes to all three</text>
  <rect x="90" y="496" width="340" height="56" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
  <text x="260.0" y="524.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e">Self-hosting earns its keep</text>
  <text x="470" y="512.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style='italic' fill="#e03131">Either way you save zero tokens.</text>
  <text x="470" y="530.2" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style='italic' fill="#e03131">Where a model runs never shortens a prompt.</text>
</svg>

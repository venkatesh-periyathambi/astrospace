  <text x="429.0" y="333.8" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14"  fill="#e8590c">Price per token</text>
  <text x="375.0" y="220.5" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style='italic' fill="#495057">this gap is</text>
  <text x="375.0" y="238.7" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style='italic' fill="#495057">the whole trade</text>
  <text x="170" y="402.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14"  fill="#1e1e1e">Small</text>
  <text x="415.0" y="402.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14"  fill="#1e1e1e">Mid</text>
  <text x="680" y="402.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14"  fill="#1e1e1e">Frontier</text>
  <text x="116" y="96.0" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style='italic' fill="#495057">1.0</text>
  <text x="116" y="380.0" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style='italic' fill="#495057">0</text>
  <text x="30" y="215.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style='italic' fill="#495057">indexed to</text>

  <text x="30" y="248.6" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style='italic' fill="#495057">tier = 1.0</text>
  <text x="130" y="436.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style='italic' fill="#495057">A model fifteen times cheaper is not fifteen times worse. On a classify-or-extract task it is often</text>
  <text x="130" y="456.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style='italic' fill="#495057">indistinguishable. That is the arbitrage, and it closes as the task gets harder.</text>

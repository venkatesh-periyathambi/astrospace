  <text x="450.0" y="541.35" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#495057">10 to 25%</text>

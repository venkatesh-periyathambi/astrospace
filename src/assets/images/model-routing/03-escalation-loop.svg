<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="880" height="470" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="440" y="34.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1e1e1e">Route optimistically, then verify</text>
  <rect x="40" y="150" width="150" height="64" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
  <text x="115.0" y="182.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e">Request</text>
  <path d="M 190,182 L 250,182" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
  <rect x="250" y="150" width="180" height="64" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="340.0" y="171.875" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e">Small model</text>
  <text x="340.0" y="192.125" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#495057">first attempt</text>
  <path d="M 430,182 L 490,182" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
  <polygon points="585.0,122 680,182.0 585.0,242 490,182.0" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
  <text x="585.0" y="164.45" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e">Gate</text>
  <text x="585.0" y="182.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#495057">valid? grounded?</text>
  <text x="585.0" y="199.54999999999998" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#495057">confident?</text>
  <path d="M 680,182 L 740,182" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
  <rect x="740" y="150" width="100" height="64" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
  <text x="790.0" y="182.0" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e">Return</text>
  <text x="690" y="164.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13"  fill="#2f9e44">pass</text>
  <path d="M 585,242 L 585,290 L 430,290" fill="none" stroke="#e03131" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#ah)"/>
  <text x="596" y="268.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13"  fill="#e03131">fail</text>
  <rect x="250" y="258" width="180" height="64" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
  <text x="340.0" y="279.875" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e">Next tier up</text>
  <text x="340.0" y="300.125" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#495057">second attempt</text>
  <path d="M 340,322 L 340,366 L 790,366 L 790,214" fill="none" stroke="#e03131" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#ah)"/>
  <text x="40" y="424.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style='italic' fill="#495057">An escalation costs two calls on that request. At a 15 percent escalation rate the blended bill is still</text>
  <text x="40" y="444.0" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style='italic' fill="#495057">comfortably under a quarter of all-frontier. Above 40 percent, your small tier is scoped wrong.</text>
</svg>

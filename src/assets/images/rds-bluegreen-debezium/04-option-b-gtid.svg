      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1100" height="600" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="48" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#1e1e1e" opacity="1.00">Option B: GTID Auto-Positioning</text>
  <rect x="30" y="120" width="240" height="100" rx="10" fill="#ffc9c9" fill-opacity="1.00" stroke="#1e1e1e" stroke-width="2" stroke-opacity="1.00"/>
  <text x="50" y="150" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">Debezium</text>
  <text x="50" y="170" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">stored offset:</text>
  <text x="60" y="190" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">gtids: ...:1-5000</text>
  <rect x="450" y="120" width="220" height="100" rx="10" fill="#a5d8ff" fill-opacity="1.00" stroke="#1971c2" stroke-width="2" stroke-opacity="1.00"/>
  <text x="470" y="150" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">BLUE replica</text>
  <text x="470" y="170" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">gtid_executed:</text>
  <text x="480" y="190" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">...:1-5234</text>
  <rect x="850" y="120" width="220" height="100" rx="10" fill="#b2f2bb" fill-opacity="1.00" stroke="#2f9e44" stroke-width="2" stroke-opacity="1.00"/>
  <text x="870" y="150" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">GREEN replica</text>
  <text x="870" y="170" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">gtid_executed:</text>
  <text x="880" y="190" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">...:1-5234 (same!)</text>
  <path d="M 270,165 L 450,165" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1.00" marker-end="url(#ah)"/>
  <text x="360" y="140" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">1. streaming binlog</text>
  <rect x="430" y="270" width="260" height="80" rx="10" fill="#ffd8a8" fill-opacity="1.00" stroke="#e8590c" stroke-width="3" stroke-opacity="1.00" stroke-dasharray="8 6"/>
  <text x="560" y="296" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#e8590c" opacity="1.00">2. Switchover</text>
  <text x="576" y="319" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#e8590c" opacity="1.00">endpoint swaps</text>
  <path d="M 150,220 L 150,420 L 750,420 L 960,230" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1.00" marker-end="url(#ah)"/>
  <text x="30" y="441" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#2f9e44" opacity="1.00">3. Debezium reconnects → sends GTID set → green auto-positions</text>
  <rect x="30" y="500" width="1040" height="70" rx="10" fill="#b2f2bb" fill-opacity="0.80" stroke="#2f9e44" stroke-width="2" stroke-opacity="0.80" stroke-dasharray="8 6"/>
  <text x="550" y="526" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#2f9e44" opacity="1.00">No offset editing, and it handles future failovers too — if the connector is caught up.</text>

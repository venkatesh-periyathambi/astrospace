<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="940" height="570" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="48" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#1e1e1e" opacity="1.00">Option A: Binlog Position Recovery</text>
  <rect x="30" y="100" width="240" height="100" rx="10" fill="#a5d8ff" fill-opacity="1.00" stroke="#1e1e1e" stroke-width="2" stroke-opacity="1.00"/>
  <text x="50" y="131" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1e1e1e" opacity="1.00">1. Pause Debezium</text>
  <text x="66" y="154" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1e1e1e" opacity="1.00">(zero lag first)</text>
  <path d="M 270,150 L 330,150" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1.00" marker-end="url(#ah)"/>
  <rect x="330" y="100" width="240" height="100" rx="10" fill="#ffd8a8" fill-opacity="1.00" stroke="#1e1e1e" stroke-width="2" stroke-opacity="1.00"/>
  <text x="350" y="131" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1e1e1e" opacity="1.00">2. Trigger B/G</text>
  <text x="366" y="154" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1e1e1e" opacity="1.00">switchover (~secs)</text>
  <path d="M 570,150 L 630,150" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1.00" marker-end="url(#ah)"/>
  <rect x="630" y="100" width="280" height="100" rx="10" fill="#ffc9c9" fill-opacity="1.00" stroke="#c92a2a" stroke-width="2" stroke-opacity="1.00"/>
  <text x="650" y="125" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">3. Read green replica's</text>
  <text x="664" y="145" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">Logs &amp; events:</text>
  <text x="664" y="165" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">binlog file + position</text>
  <path d="M 770,210 L 770,270" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1.00" marker-end="url(#ah)"/>
  <rect x="630" y="280" width="280" height="100" rx="10" fill="#ffc9c9" fill-opacity="1.00" stroke="#c92a2a" stroke-width="2" stroke-opacity="1.00"/>
  <text x="650" y="305" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">4. Update offset in</text>
  <text x="664" y="325" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">connect-offsets:</text>
  <text x="664" y="345" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1e1e1e" opacity="1.00">{ file, pos }</text>
  <path d="M 630,330 L 570,330" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1.00" marker-end="url(#ah)"/>
  <rect x="330" y="280" width="240" height="100" rx="10" fill="#b2f2bb" fill-opacity="1.00" stroke="#1e1e1e" stroke-width="2" stroke-opacity="1.00"/>
  <text x="350" y="311" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1e1e1e" opacity="1.00">5. Resume connector</text>
  <text x="366" y="334" text-anchor="start" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1e1e1e" opacity="1.00">→ CDC resumes</text>
  <rect x="30" y="470" width="880" height="70" rx="10" fill="#ffc9c9" fill-opacity="0.80" stroke="#c92a2a" stroke-width="2" stroke-opacity="0.80" stroke-dasharray="8 6"/>
  <text x="470" y="496" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#c92a2a" opacity="1.00">Steps 3 &amp; 4 are manual every time. Fat-finger the offset → gaps or duplicates.</text>
</svg>

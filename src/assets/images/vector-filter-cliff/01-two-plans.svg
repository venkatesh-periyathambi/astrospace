<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="1180" height="629" role="img">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="720" height="384" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#212529">
    <line x1="360" y1="16" x2="360" y2="340" stroke="#dee2e6" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="176" y="30" text-anchor="middle" font-size="15" font-weight="700">POST-FILTER</text>
    <text x="544" y="30" text-anchor="middle" font-size="15" font-weight="700">PRE-FILTER</text>

    <rect x="56" y="48" width="240" height="36" rx="6" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
    <text x="176" y="71" text-anchor="middle" font-size="13">query vector</text>
    <line x1="176" y1="84" x2="176" y2="106" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/>
    <rect x="56" y="110" width="240" height="44" rx="6" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
    <text x="176" y="137" text-anchor="middle" font-size="13">ANN over FULL index</text>
    <line x1="176" y1="154" x2="176" y2="198" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="184" y="181" font-size="11" fill="#868e96">top-M candidates</text>
    <rect x="56" y="202" width="240" height="44" rx="6" fill="#a5d8ff" fill-opacity="0.40" stroke="#1971c2" stroke-width="2"/>
    <text x="176" y="229" text-anchor="middle" font-size="13" font-weight="700" fill="#1864ab">apply predicate</text>
    <line x1="176" y1="246" x2="176" y2="290" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="184" y="273" font-size="11" fill="#868e96">survivors</text>
    <rect x="56" y="294" width="240" height="36" rx="6" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
    <text x="176" y="317" text-anchor="middle" font-size="13">return top-K</text>
    <text x="176" y="356" text-anchor="middle" font-size="11.5" fill="#495057">Index stays fast and intact.</text>
    <text x="176" y="372" text-anchor="middle" font-size="11.5" fill="#495057">K may never fill.</text>

    <rect x="424" y="48" width="240" height="36" rx="6" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
    <text x="544" y="71" text-anchor="middle" font-size="13">query vector</text>
    <line x1="544" y1="84" x2="544" y2="106" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/>
    <rect x="424" y="110" width="240" height="44" rx="6" fill="#a5d8ff" fill-opacity="0.40" stroke="#1971c2" stroke-width="2"/>
    <text x="544" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#1864ab">evaluate predicate</text>
    <line x1="544" y1="154" x2="544" y2="198" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="552" y="181" font-size="11" fill="#868e96">eligible ID set</text>
    <rect x="424" y="202" width="240" height="44" rx="6" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
    <text x="544" y="229" text-anchor="middle" font-size="13">rank vectors in set</text>
    <line x1="544" y1="246" x2="544" y2="290" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="552" y="273" font-size="11" fill="#868e96">scored matches</text>
    <rect x="424" y="294" width="240" height="36" rx="6" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
    <text x="544" y="317" text-anchor="middle" font-size="13">return top-K</text>
    <text x="544" y="356" text-anchor="middle" font-size="11.5" fill="#495057">Every candidate is valid.</text>
    <text x="544" y="372" text-anchor="middle" font-size="11.5" fill="#495057">Cost scales with set size.</text>
  </g>
</svg>
